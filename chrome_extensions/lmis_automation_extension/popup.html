<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMIS Automation</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>LMIS Automation</h1>
        <p>Upload a Word document to auto-create establishment entries.</p>
      </header>

      <section class="upload">
        <label for="docInput">Select Document (.docx preferred)</label>
        <input id="docInput" type="file" accept=".doc,.docx" />
        <p class="hint" id="docHint">Documents are parsed locally; no data leaves your browser.</p>
      </section>

      <section class="status" id="statusPanel" hidden>
        <h2>Parsed Establishments</h2>
        <div class="status-summary" id="statusSummary"></div>
        <ul class="establishments" id="establishmentList"></ul>
      </section>

      <section class="actions">
        <button id="startAutomation" class="primary" disabled>Start Automation</button>
        <button id="clearData" class="secondary" disabled>Clear</button>
      </section>

      <section class="messages">
        <div id="message" role="status" aria-live="polite"></div>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
